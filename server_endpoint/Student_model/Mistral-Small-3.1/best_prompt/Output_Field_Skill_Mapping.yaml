    source_outputs: [Supplied_Organ_or_Site, Organ_Context_Status, Relevant_Parenchyma_Present, Selected_Organ_Module, Organ_Module_Version, Organ_Module_Loading_Status, Missing_Requirements, Effect_on_Analysis, Limitations]

skillopt_scoring_scopes:
  Specimen_Image_and_Stain_Context:
    score_paths: [Image_Context]
  Pathology_Image_Quality_and_Structured_Morphology_Reporting:
    score_paths: [Analysis_Metadata.Integrated_Analysis_Status, Image_Quality, Morphological_Summary, Limitations]
  Tissue_Component_Recognition:
    score_paths: [Image_Quality.Tissue_Coverage, Findings.Tissue_Components]
  Cellular_Cytoplasmic_and_Nuclear_Morphology:
    score_paths: [Findings.Cellular_Cytoplasmic_and_Nuclear_Morphology]
  General_Tissue_Architecture_Analysis:
