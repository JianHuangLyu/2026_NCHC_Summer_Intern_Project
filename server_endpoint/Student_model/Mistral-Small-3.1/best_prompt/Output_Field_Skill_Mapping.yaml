    source_outputs: [Vessels_or_Vascular_Like_Channels, Vessel_Density, Vessel_Caliber, Vessel_Wall_Morphology, Branching_or_Channel_Pattern, Perivascular_Arrangement, Congestion, Hemorrhage, Extravasated_Erythrocytes, Thrombus_Like_Material, Fibrin_Like_Material]
  Findings.Special_Findings.Calcification_or_Mineralization:
