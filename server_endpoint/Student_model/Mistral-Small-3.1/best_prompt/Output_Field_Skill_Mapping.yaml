  Extracellular_Matrix_and_Stromal_Morphology:
    score_paths: [Findings.Extracellular_Matrix_and_Stroma]
  Vascular_Hemorrhagic_and_Circulatory_Features:
    score_paths: [Findings.Special_Findings.Vascular_or_Hemorrhagic_Features]
  Inflammation_and_Immune_Microenvironment:
    score_paths: [Findings.Special_Findings.Inflammation]
  Cell_Death_Mitotic_Activity_and_Deposition_Analysis:
    score_paths: [Findings.Special_Findings.Mitotic_Figures, Findings.Special_Findings.Necrosis_or_Cell_Death, Findings.Special_Findings.Cellular_Debris, Findings.Special_Findings.Calcification_or_Mineralization, Findings.Special_Findings.Other_Deposited_Material]
  Tissue_Border_Interface_and_Growth_Pattern:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Tissue_Border_Interface_and_Growth_Pattern]
  Lumina_Cysts_Channels_and_Tissue_Spaces_Analysis:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Lumina_Cysts_Channels_and_Tissue_Spaces_Analysis]
  Spatial_Heterogeneity_and_Multiregion_Analysis:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Spatial_Heterogeneity_and_Multiregion_Analysis]
  Morphological_Deviation_and_Disorganization_Assessment:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Morphological_Deviation_and_Disorganization_Assessment]
  Epithelial_and_Glandular_Architecture:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Epithelial_and_Glandular_Architecture]
  Soft_Tissue_and_Mesenchymal_Patterns:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Soft_Tissue_and_Mesenchymal_Patterns]
  Lymphoid_and_Hematopoietic_Architecture:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Lymphoid_and_Hematopoietic_Architecture]
  Neural_and_Glial_Tissue_Morphology:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Neural_and_Glial_Tissue_Morphology]
  Bone_Cartilage_and_Osteoid_Morphology:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Bone_Cartilage_and_Osteoid_Morphology]
  Muscle_Tissue_Morphology:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Muscle_Tissue_Morphology]
  Organ_Specific_Parenchymal_Morphology_Router:
    score_paths: [Findings.Conditional_Findings.Module_Findings.Organ_Specific_Parenchymal_Morphology_Router]
