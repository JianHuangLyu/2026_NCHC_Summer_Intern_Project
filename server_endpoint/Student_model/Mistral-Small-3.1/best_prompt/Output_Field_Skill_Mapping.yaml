  Findings.Cellular_Cytoplasmic_and_Nuclear_Morphology.Cell_Shape:
    primary_skill: Cellular_Cytoplasmic_and_Nuclear_Morphology
    source_outputs: [Predominant_Cell_Shape, Secondary_Cell_Shapes]
  Findings.Cellular_Cytoplasmic_and_Nuclear_Morphology.Cytoplasmic_Features:
    primary_skill: Cellular_Cytoplasmic_and_Nuclear_Morphology
    source_outputs: [Cytoplasmic_Amount, Cytoplasmic_Quality, Cytoplasmic_Vacuoles_or_Inclusions]
  Findings.Cellular_Cytoplasmic_and_Nuclear_Morphology.Cell_Borders:
    primary_skill: Cellular_Cytoplasmic_and_Nuclear_Morphology
