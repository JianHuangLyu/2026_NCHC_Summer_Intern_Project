    source_outputs: [Lymphoid_or_Hematopoietic_Tissue, Architectural_Pattern, Follicle_or_Zone_Morphology, Predominant_Cell_Population_Morphology, Population_Uniformity_and_Heterogeneity, Sinus_Cord_or_Marrow_Space_Organization, Background_and_Debris, Assessability, Limitations]
  Neural_and_Glial_Tissue_Morphology:
    output_path: Findings.Conditional_Findings.Module_Findings.Neural_and_Glial_Tissue_Morphology
    source_outputs: [Neural_or_Glial_Component, Background_or_Matrix, Cellular_Morphology, Architectural_Pattern, Nerve_Fascicle_or_Fiber_Organization, Rosette_Palisading_or_Perivascular_Arrangement, Microcystic_or_Vascular_Features, Assessability, Limitations]
  Bone_Cartilage_and_Osteoid_Morphology:
