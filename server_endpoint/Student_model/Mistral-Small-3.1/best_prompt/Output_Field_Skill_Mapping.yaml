conditional_module_mappings:
  Tissue_Border_Interface_and_Growth_Pattern:
    output_path: Findings.Conditional_Findings.Module_Findings.Tissue_Border_Interface_and_Growth_Pattern
    source_outputs: [Border_Presence, Border_Completeness, Border_Morphology, Capsule_Like_Tissue, Interface_with_Adjacent_Tissue, Entrapment_or_Interdigitation, Visible_Structural_Relationships, ROI_Edge_Limitation, Assessability, Limitations]
