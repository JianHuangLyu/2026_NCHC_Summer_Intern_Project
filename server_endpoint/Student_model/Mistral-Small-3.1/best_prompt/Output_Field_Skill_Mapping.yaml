    output_path: Findings.Conditional_Findings.Module_Findings.Lumina_Cysts_Channels_and_Tissue_Spaces_Analysis
    source_outputs: [Space_Presence, Space_Type, Lining_Morphology, Number, Size, Shape, Distribution, Distortion_or_Dilation, Content, Possible_Artifact, Assessability, Limitations]
