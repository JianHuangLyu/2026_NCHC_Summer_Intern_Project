version: 1.0
output_schema: ./2026NCHC_Summer_Intern/Prompt/Output_Schema.json

purpose:
  - Define the authoritative relationship between final JSON fields and Skill outputs.
  - Restrict integration to outputs produced by successfully loaded and applicable Skills.
  - Define the scoring scope when SkillOpt optimizes one Skill at a time.

mapping_rules:
  primary_skill_is_accountable: true
  source_outputs_must_exist_in_skill_output: true
  conditional_native_outputs_are_preserved: true
  unavailable_skill_dependent_fields: N/A
  do_not_convert_not_evaluable_to_absent: true

system_managed_fields:
  Schema_Version:
    source: Output_Schema.json
  Analysis_Metadata.Analysis_Purpose:
    source: Prompt.md
  Analysis_Metadata.Analysis_Scope:
    source: Prompt.md
  Analysis_Metadata.Loaded_Skills:
    source: runtime_loader
  Analysis_Metadata.Conditional_Skills_Not_Performed:
    source: runtime_loader
  Analysis_Metadata.Unavailable_Skills:
    source: runtime_loader
  Findings.Conditional_Findings.Activated_Modules:
    source: Skill_Registry.yaml
  Findings.Conditional_Findings.Module_Findings:
    source: successfully_loaded_conditional_skills

field_mappings:
  Analysis_Metadata.Integrated_Analysis_Status:
    primary_skill: Pathology_Image_Quality_and_Structured_Morphology_Reporting
    source_outputs: [Integrated_Report_Status, Module_Applicability_and_Loading_Status]

  Image_Context.Image_Type:
    primary_skill: Specimen_Image_and_Stain_Context
    source_outputs: [Image_Level]
  Image_Context.Stain:
    primary_skill: Specimen_Image_and_Stain_Context
    source_outputs: [Stain_or_Modality]
  Image_Context.Magnification_or_MPP:
    primary_skill: Specimen_Image_and_Stain_Context
    source_outputs: [Scanner_and_Scale]
  Image_Context.Organ_or_Site:
    primary_skill: Specimen_Image_and_Stain_Context
    source_outputs: [Organ_or_Anatomical_Site]

  Image_Quality.Focus:
    primary_skill: Pathology_Image_Quality_and_Structured_Morphology_Reporting
    source_outputs: [Image_Quality]
  Image_Quality.Resolution:
    primary_skill: Pathology_Image_Quality_and_Structured_Morphology_Reporting
    source_outputs: [Image_Quality]
  Image_Quality.Staining_Quality:
    primary_skill: Pathology_Image_Quality_and_Structured_Morphology_Reporting
    source_outputs: [Image_Quality]
  Image_Quality.Artifacts:
    primary_skill: Pathology_Image_Quality_and_Structured_Morphology_Reporting
    source_outputs: [Image_Quality]
  Image_Quality.Tissue_Coverage:
    primary_skill: Tissue_Component_Recognition
    source_outputs: [Tissue_Coverage]
  Image_Quality.Overall_Assessability:
    primary_skill: Pathology_Image_Quality_and_Structured_Morphology_Reporting
    source_outputs: [Overall_Assessability]
  Image_Quality.Limitations:
    primary_skill: Pathology_Image_Quality_and_Structured_Morphology_Reporting
    source_outputs: [Image_Limitations]

  Findings.Tissue_Components.Predominant_Component:
    primary_skill: Tissue_Component_Recognition
    source_outputs: [Predominant_Tissue_Component]
  Findings.Tissue_Components.Additional_Components:
    primary_skill: Tissue_Component_Recognition
    source_outputs: [Additional_Tissue_Components, Unclassified_Tissue_Component]
  Findings.Tissue_Components.Component_Distribution:
    primary_skill: Tissue_Component_Recognition
    source_outputs: [Component_Distribution, Component_Proportions]
  Findings.Tissue_Components.Spatial_Organization:
    primary_skill: Tissue_Component_Recognition
