  Findings.General_Tissue_Architecture.Architectural_Organization:
    primary_skill: General_Tissue_Architecture_Analysis
    source_outputs: [Architectural_Organization, Preserved_or_Disrupted_Native_Architecture]

  Findings.Extracellular_Matrix_and_Stroma.Stromal_Amount:
    primary_skill: Extracellular_Matrix_and_Stromal_Morphology
