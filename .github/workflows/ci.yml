name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r client/requirements.txt
      - name: Check Slurm script syntax
        run: bash -n slurm/pathovision_vlm_stack.sbatch slurm/pathovision_api.sbatch.example
      - name: Run server and integration tests
        run: python -m unittest discover -v tests
      - name: Run client tests
        working-directory: client
        run: python -m unittest discover -v . "test_*.py"
